name: Android Feature Build

# Fast feature-branch APK build with focused checks.
# Full emulator and lint checks are available through manual dispatch.
on:
  push:
    branches:
      - feat/alexa-backend
    paths-ignore:
      - '.github/signing/debug-certificate.sha256'
  workflow_dispatch:
    inputs:
      stable_release:
        description: Build a signed, optimized stable APK and run release JVM checks (no emulator)
        type: boolean
        default: false
      library_player_tests:
        description: Run affected downloads, playlist, queue, ownership and rate-limit unit tests (no emulator)
        type: boolean
        default: false
      handoff_tests:
        description: Run only audio output handoff and ownership unit tests (no emulator)
        type: boolean
        default: false
      playback_tests:
        description: Run only the focused player and feature regression tests
        type: boolean
        default: false
      full_ui_tests:
        description: Run the full emulator suite and lint (slower)
        type: boolean
        default: false

jobs:
  verify-connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check playback, queue and device protocol (no emulator)
        run: sh ./gradlew testDebugUnitTest --tests 'com.example.juke.services.SharedPlaybackOutputTest' --tests 'com.example.juke.services.DeviceQueueStartupTest' --tests 'com.example.juke.services.PhoneQueuePublicationTest' --tests 'com.example.juke.services.PlaybackHandoffTest' --tests 'com.example.juke.services.OutputSwitchRequestsTest' --tests 'com.example.juke.services.SilentPlaybackWatchdogTest' --tests 'com.example.juke.viewmodels.PlaylistRemainderTest' --no-daemon

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 8.13.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore stable APK signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/music-box-debug.keystore
          key: music-box-debug-signing-v1

      - name: Prepare and verify APK signing identity
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          signing_store="$HOME/.android/music-box-debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          elif [ ! -f "$signing_store" ]; then
            if [ -f .github/signing/debug-certificate.sha256 ]; then
              echo "The preserved signing key is missing. Restore the original key using ANDROID_DEBUG_KEYSTORE_BASE64; a replacement key would break installed-app updates."
              exit 1
            fi
            keytool -genkeypair -keystore "$signing_store" -storepass android -keypass android -alias androiddebugkey -dname "CN=Music Box Debug,O=Music Box,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          fi
          chmod 600 "$signing_store"
          keytool -exportcert -keystore "$signing_store" -storepass android -alias androiddebugkey -file /tmp/music-box-signing-cert.der >/dev/null
          sha256sum /tmp/music-box-signing-cert.der | cut -d ' ' -f 1 > signing-certificate.sha256
          if [ -f .github/signing/debug-certificate.sha256 ]; then
            cmp .github/signing/debug-certificate.sha256 signing-certificate.sha256 || {
              echo "APK signing certificate changed. Restore the original key to keep updates installable."
              exit 1
            }
          fi
          echo "MUSIC_BOX_SIGNING_STORE=$signing_store" >> "$GITHUB_ENV"

      - name: Preserve APK signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/music-box-debug.keystore
          key: music-box-debug-signing-v1

      - name: Upload public signing certificate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: signing-certificate
          path: signing-certificate.sha256

      - name: Generate local.properties from secrets
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          ALEXA_SESSION_BASE_URL=https://alexa.synthora.in
          ALEXA_BASE_URL=https://alexa.synthora.in
          ALEXA_API_KEY=${{ secrets.ALEXA_API_KEY }}
          EOF

      - name: Check account login is enabled
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://alexa.synthora.in/login/)
          test "$status" = "200" || { echo "Account login endpoint returned $status instead of 200"; exit 1; }

      - name: Check audio output handoff and ownership
        if: ${{ inputs.handoff_tests == true }}
        run: sh ./gradlew testDebugUnitTest --tests 'com.example.juke.services.PlaybackHandoffTest' --tests 'com.example.juke.services.SharedPlaybackOutputTest' --tests 'com.example.juke.services.OutputSwitchRequestsTest' --tests 'com.example.juke.viewmodels.PlaylistRemainderTest' --tests 'com.example.juke.services.SilentPlaybackWatchdogTest' --no-daemon

      - name: Check affected download, playlist and queue logic
        if: ${{ inputs.library_player_tests == true && inputs.stable_release != true }}
        run: sh ./gradlew testDebugUnitTest --tests 'com.example.juke.database.DownloadManifestDatabaseTest' --tests 'com.example.juke.services.ArchitecturePolicyTest' --tests 'com.example.juke.services.EchoSnapshotTest' --tests 'com.example.juke.network.CollectionContentTest' --tests 'com.example.juke.network.ArtworkTest' --tests 'com.example.juke.services.PlaybackResumeTest' --tests 'com.example.juke.network.DownloadCookiesTest' --tests 'com.example.juke.network.RateLimitRetryTest' --tests 'com.example.juke.network.BrowseParserTest' --tests 'com.example.juke.network.PhoneQueueRequestTest' --tests 'com.example.juke.services.DownloadedCollectionTest' --tests 'com.example.juke.services.SharedPlaybackOutputTest' --tests 'com.example.juke.services.SharedQueueTest' --tests 'com.example.juke.services.QueueContinuationTest' --tests 'com.example.juke.services.DeviceQueueStartupTest' --tests 'com.example.juke.services.PhoneQueuePublicationTest' --tests 'com.example.juke.services.PlaybackHandoffTest' --tests 'com.example.juke.services.OutputSwitchRequestsTest' --tests 'com.example.juke.viewmodels.PlaylistRemainderTest' --tests 'com.example.juke.services.SilentPlaybackWatchdogTest' --no-daemon

      - name: Check release logic and update channel
        if: ${{ inputs.stable_release == true }}
        run: sh ./gradlew testReleaseUnitTest --no-daemon

      - name: Check browse, playback presentation and Echo snapshots
        if: ${{ inputs.handoff_tests != true && inputs.library_player_tests != true && inputs.stable_release != true }}
        run: sh ./gradlew testDebugUnitTest --tests 'com.example.juke.network.PhoneQueueRequestTest' --tests 'com.example.juke.network.DownloadCookiesTest' --tests 'com.example.juke.network.BrowseParserTest' --tests 'com.example.juke.network.NetworkErrorTest' --tests 'com.example.juke.models.PlaybackPresentationTest' --tests 'com.example.juke.services.EchoSnapshotTest' --tests 'com.example.juke.services.DeviceQueueStartupTest' --tests 'com.example.juke.services.PlaybackHandoffTest' --tests 'com.example.juke.services.OutputSwitchRequestsTest' --tests 'com.example.juke.network.ArtworkTest' --tests 'com.example.juke.network.DeviceAudioTest' --tests 'com.example.juke.utils.LogRedactionTest' --tests 'com.example.juke.services.DownloadedCollectionTest' --tests 'com.example.juke.services.SharedQueueTest' --tests 'com.example.juke.services.QueueContinuationTest' --tests 'com.example.juke.services.SharedPlaybackOutputTest' --tests 'com.example.juke.services.PhoneQueuePublicationTest' --tests 'com.example.juke.network.SearchRankingTest' --tests 'com.example.juke.network.YoutubeLinkTest' --tests 'com.example.juke.utils.PlaybackTimeTest' --tests 'com.example.juke.utils.OfflineNavigationTest' --no-daemon

      - name: Upload handoff test results
        if: ${{ always() && (inputs.handoff_tests == true || inputs.library_player_tests == true || inputs.stable_release == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: handoff-test-results
          path: app/build/test-results/test*UnitTest/*.xml

      - name: Build signed APK (SDK runs only in Actions)
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.stable_release == true && 'assembleRelease' || 'assembleDebug' }} --no-daemon

      - name: Verify stable APK and package checksums
        if: ${{ inputs.stable_release == true }}
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/verify_release_apk.py "$build_tools" app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Upload stable APK
        if: ${{ inputs.stable_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release-artifacts/
          if-no-files-found: error

      - name: Preserve release crash mapping
        if: ${{ inputs.stable_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Build optional UI test APK
        if: ${{ inputs.stable_release != true && (inputs.full_ui_tests == true || inputs.playback_tests == true) }}
        run: ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Report lint findings
        if: ${{ inputs.full_ui_tests == true }}
        continue-on-error: true
        run: |
          ./gradlew lintDebug --no-daemon || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }

      - name: Upload lint report
        if: ${{ always() && inputs.full_ui_tests == true }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

      - name: Upload debug APK
        if: ${{ inputs.stable_release != true }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload UI test APK
        if: ${{ inputs.stable_release != true && (inputs.full_ui_tests == true || inputs.playback_tests == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk

  ui-tests:
    if: ${{ inputs.stable_release != true && (inputs.full_ui_tests == true || inputs.playback_tests == true) }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pixel_6
            tablet: false
          - profile: pixel_c
            tablet: true
    steps:
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Download app APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Download test APK
        uses: actions/download-artifact@v4
        with:
          name: ui-test-apk
          path: test-apk

      - name: Exercise requested native regression checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            adb install test-apk/app-debug-androidTest.apk
            adb shell am instrument -w -e class ${{ matrix.tablet && 'com.example.juke.TabletPlaybackRegressionTest,com.example.juke.CollectionParityRegressionTest,com.example.juke.QueueRecoveryRegressionTest' || inputs.playback_tests && 'com.example.juke.PlaybackStreamRegressionTest,com.example.juke.FeatureInteractionRegressionTest,com.example.juke.TabletPlaybackRegressionTest,com.example.juke.CollectionParityRegressionTest,com.example.juke.QueueRecoveryRegressionTest' || 'com.example.juke.DownloadCookieUiTest,com.example.juke.UiRefinementRegressionTest,com.example.juke.BetaUiRegressionTest,com.example.juke.WebLayoutRegressionTest' }} com.example.juke.test/androidx.test.runner.AndroidJUnitRunner > ui-results.txt
            [ "${{ inputs.full_ui_tests }}" != "true" ] || adb pull /sdcard/Android/data/com.example.juke/files/screenshots screenshots
            cat ui-results.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' ui-results.txt
            grep -E 'OK \([0-9]+ tests?\)' ui-results.txt

      - name: Upload UI results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-results-${{ matrix.profile }}
          path: |
            ui-results.txt
            screenshots
