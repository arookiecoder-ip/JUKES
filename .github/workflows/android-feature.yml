name: Android Feature Build

# Feature-branch CI for feat/alexa-backend. The stable android.yml (push
# beta,main + PR) is deliberately untouched — this file only builds the
# Alexa-backend feature branch and uploads a test APK.
on:
  push:
    branches:
      - feat/alexa-backend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by AGP 8.13.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate local.properties from secrets
        run: |
          cat > local.properties <<'EOF'
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          ALEXA_SESSION_BASE_URL=https://alexa.synthora.in
          ALEXA_BASE_URL=${{ secrets.ALEXA_BASE_URL_STAGING }}
          ALEXA_API_KEY=${{ secrets.ALEXA_API_KEY_STAGING }}
          EOF

      - name: Check account login is enabled
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://alexa.synthora.in/login/)
          test "$status" = "200" || { echo "Account login endpoint returned $status instead of 200"; exit 1; }

      - name: Test backend and native remote contracts
        run: sh ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK (no local SDK needed; ANDROID_HOME is preinstalled)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Report lint findings
        continue-on-error: true
        run: |
          ./gradlew lintDebug --no-daemon || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk

  ui-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Download app APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Download test APK
        uses: actions/download-artifact@v4
        with:
          name: ui-test-apk
          path: test-apk

      - name: Exercise Home, queue and web-style sliders
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            adb install test-apk/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.example.juke.UiRefinementRegressionTest,com.example.juke.BetaUiRegressionTest,com.example.juke.WebLayoutRegressionTest com.example.juke.test/androidx.test.runner.AndroidJUnitRunner > ui-results.txt
            cat ui-results.txt
            adb pull /sdcard/Android/data/com.example.juke/files/screenshots screenshots
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' ui-results.txt
            grep -E 'OK \([0-9]+ tests?\)' ui-results.txt

      - name: Upload UI results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-results
          path: |
            ui-results.txt
            screenshots
